apiVersion: v1
kind: Service
metadata:
  name: k8s-ai-agent
  namespace: k8s-ai-agent
  labels:
    app: k8s-ai-agent
spec:
  type: ClusterIP   # Internal only — anomaly-detector calls it in-cluster
  selector:
    app: k8s-ai-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
