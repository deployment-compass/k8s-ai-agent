apiVersion: v1
kind: Namespace
metadata:
  name: k8s-ai-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-ai-agent
  namespace: k8s-ai-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ai-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ai-agent
subjects:
  - kind: ServiceAccount
    name: k8s-ai-agent
    namespace: k8s-ai-agent
roleRef:
  kind: ClusterRole
  name: k8s-ai-agent
  apiGroup: rbac.authorization.k8s.io
